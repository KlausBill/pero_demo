<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Lora:wght@400;700&family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<title>Перо</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{
  --bg:#0f0f12; --panel:#17171c; --panel2:#1f1f24; --panel3:#26262e;
  --border:#2a2a32; --border2:#3a3a44;
  --text:#ededf0; --muted:#8a8a95; --muted2:#5f5f6b;
  --accent:#6b8afd; --accent-bg:rgba(107,138,253,0.12); --accent-d:#4e6cd8;
  --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
  --r:16px; --r-sm:12px; --r-xs:8px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --tr:.2s ease-out;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.2); --shadow-md:0 4px 12px rgba(0,0,0,0.3);
}
[data-theme="light"]{
  --bg:#f7f7f9; --panel:#ffffff; --panel2:#f0f0f3; --panel3:#e5e5ea;
  --border:#e5e5ea; --border2:#d1d1d6;
  --text:#1c1c1e; --muted:#8e8e93; --muted2:#aeaeb2;
  --accent:#5a7cf5; --accent-bg:rgba(90,124,245,0.1); --accent-d:#3f5bc1;
  --ok:#34c759; --warn:#ff9f0a; --danger:#ff3b30;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05); --shadow-md:0 8px 24px rgba(0,0,0,0.08);
}
[data-theme="sepia"]{
  --bg:#f4ecd8; --panel:#efe5cc; --panel2:#e8dcc0; --panel3:#dfd2b3;
  --border:#d8cbaa; --border2:#c8ba94;
  --text:#3b3428; --muted:#8a7f68; --muted2:#a89d84;
  --accent:#a0522d; --accent-bg:rgba(160,82,45,0.12);
  --shadow-sm:none; --shadow-md:0 4px 12px rgba(0,0,0,0.05);
}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button,input,select,textarea{font-family:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0;font:inherit;color:inherit}
::selection{background:var(--accent-bg);color:var(--accent)}

/* SVG UTILS */
.svg-ico{width:22px;height:22px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;display:block}
.svg-ico.sm{width:18px;height:18px}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:4px;padding:10px 12px;padding-top:calc(10px + var(--safe-t));background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:10}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background var(--tr),transform var(--tr);flex-shrink:0}
.icon-btn:active{background:var(--panel2);transform:scale(.9)}
.book-btn{flex:1;min-width:0;text-align:center;padding:4px 6px;border-radius:var(--r-xs);display:flex;flex-direction:column;gap:2px;transition:background var(--tr)}
.book-btn:active{background:var(--panel2)}
.book-btn .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.3px}
.book-btn .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* CONTENT & PANELS */
.content{flex:1;display:grid;grid-template:1fr/1fr;overflow:hidden;position:relative;min-height:0;transition:transform var(--tr),opacity var(--tr)}
body.drawer-open .content{transform:translate3d(40px,0,0) scale(.96);opacity:.5}
.panel{grid-area:1/1;opacity:0;transform:translate3d(0,4px,0);pointer-events:none;transition:opacity var(--tr),transform var(--tr);overflow:hidden;min-height:0;display:flex;flex-direction:column}
.panel.active{opacity:1;transform:translate3d(0,0,0);pointer-events:auto}

/* EDITOR */
.editor-wrap{flex:1;display:flex;overflow:hidden;min-width:0;position:relative}
.editor-inner{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;padding:16px 20px 0;min-height:0;min-width:0}
#chapterTitle{background:none;border:none;font-size:24px;font-weight:700;padding:4px 0 16px;outline:none;width:100%;flex-shrink:0;letter-spacing:-0.5px}
#chapterTitle::placeholder{color:var(--muted2);opacity:.8}
#editor{flex:1;width:100%;background:none;border:none;outline:none;resize:none;padding:0 0 40px;caret-color:var(--accent);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-width:0;color:var(--text)}
#editor::placeholder{color:var(--muted2);opacity:.6}
body.focus-highlight #editor{-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 20%,black 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,black 20%,black 80%,transparent 100%)}
.editor-stats{display:flex;gap:8px;font-size:12px;color:var(--muted);padding:10px 20px 12px;flex-shrink:0;border-top:1px solid var(--border);align-items:center;flex-wrap:wrap;min-width:0;font-weight:500}
.editor-stats .dot{opacity:.3}
.editor-stats .goal{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;flex-shrink:0}
.goal-bar{width:56px;height:4px;background:var(--panel3);border-radius:4px;overflow:hidden}
.goal-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width var(--tr)}
.goal-bar i.done{background:var(--ok)}
.link-btn{color:var(--accent);cursor:pointer;font-weight:600}

/* LISTS & CARDS */
.panel-header{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-shrink:0;border-bottom:1px solid var(--border);min-width:0}
.panel-header h2{flex:1;margin:0;font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:8px;min-width:0;letter-spacing:-0.3px}
.panel-header h2 .count{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel2);padding:2px 8px;border-radius:10px}
.panel-header .actions{display:flex;gap:6px;flex-shrink:0}
.search-bar{padding:12px 16px;flex-shrink:0}
.search-bar input{width:100%;padding:12px 16px;background:var(--panel2);border:1px solid transparent;border-radius:var(--r-sm);font-size:14px;outline:none;transition:border var(--tr),background var(--tr);-webkit-appearance:none;font-weight:500}
.search-bar input:focus{border-color:var(--border2);background:var(--panel)}
.list-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px 24px;min-width:0}

.char-card,.draft-card,.event-card,.loc-card{display:flex;gap:14px;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;cursor:pointer;transition:transform var(--tr),background var(--tr),box-shadow var(--tr);min-width:0;overflow:hidden;box-shadow:var(--shadow-sm)}
.char-card:active,.draft-card:active,.event-card:active,.loc-card:active{transform:scale(.98);background:var(--panel2)}
.char-avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
.loc-avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--panel3)}
.char-info{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.char-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:-0.2px}
.char-role{font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.char-desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:500}

/* Filter Chips */
.draft-filters{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.draft-filters::-webkit-scrollbar{display:none}
.filter-chip{padding:8px 14px;border-radius:20px;background:var(--panel2);border:1px solid transparent;font-size:13px;color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all var(--tr);font-weight:600}
.filter-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--shadow-sm)}

/* Timeline */
.timeline-list{position:relative;padding-left:28px}
.timeline-list::before{content:'';position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--border);border-radius:2px}
.event-card{position:relative;flex-direction:column;gap:0}
.event-card::before{content:'';position:absolute;left:-24px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 2px var(--accent)}
.event-card.imp-high::before{background:var(--danger);box-shadow:0 0 0 2px var(--danger)}
.event-card.imp-med::before{background:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.event-card.imp-low::before{background:var(--muted2);box-shadow:0 0 0 2px var(--muted2)}
.event-date{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
.event-date .link-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--muted);font-weight:600;text-transform:none}
.event-title{font-size:15px;font-weight:600;margin-bottom:4px;letter-spacing:-0.2px}
.event-desc{font-size:13px;color:var(--muted);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:500}

/* Drafts */
.draft-card{flex-direction:column;gap:6px}
.draft-card.pinned{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset, var(--shadow-sm)}
.draft-head{display:flex;align-items:center;gap:8px;min-width:0}
.draft-cat{font-size:10px;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;flex-shrink:0}
.draft-cat.idea{background:rgba(255,184,107,.15);color:var(--warn)}
.draft-cat.plot{background:var(--accent-bg);color:var(--accent)}
.draft-cat.thought{background:rgba(52,211,153,.15);color:var(--ok)}
.draft-cat.place{background:rgba(180,124,255,.15);color:#b47cff}
.draft-cat.note{background:var(--panel3);color:var(--muted)}
.draft-cat.foreshadow{background:rgba(255,215,0,.15);color:#ffd700}
.draft-title{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:-0.2px}
.draft-pin{font-size:14px;opacity:.3;padding:2px 4px}
.draft-card.pinned .draft-pin{opacity:1;color:var(--accent)}
.draft-text{font-size:13px;color:var(--muted);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-weight:500}

/* Empty State */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:1.6;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-weight:500}
.empty svg{width:56px;height:56px;stroke:var(--border2);stroke-width:1.5;margin-bottom:16px;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* NOTES MODE */
.notes-layout{flex:1;position:relative;display:flex;overflow:hidden;min-height:0}
.notes-drawer{position:absolute;top:0;bottom:0;left:0;width:min(82vw,300px);background:var(--panel2);z-index:20;display:flex;flex-direction:column;transform:translate3d(-105%,0,0);transition:transform var(--tr);box-shadow:var(--shadow-md)}
.notes-drawer.open{transform:translate3d(0,0,0)}
.notes-drawer-hd{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--border);flex-shrink:0}
.notes-drawer-hd h3{flex:1;margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.2px}
.notes-list{flex:1;overflow-y:auto;padding:8px 8px 24px}
.note-item{padding:12px;border-radius:var(--r-sm);margin-bottom:4px;cursor:pointer;min-width:0;overflow:hidden;transition:background var(--tr)}
.note-item:active{background:var(--panel3)}
.note-item.active{background:var(--panel3);box-shadow:inset 3px 0 var(--accent)}
.note-item-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;letter-spacing:-0.2px}
.note-item-prev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.note-item-date{font-size:10px;color:var(--muted2);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.notes-scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:19;opacity:0;pointer-events:none;transition:opacity var(--tr);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.notes-scrim.show{opacity:1;pointer-events:auto}
.notes-main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.notes-main-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.note-title-input{flex:1;background:none;border:none;font-size:20px;font-weight:700;padding:4px;outline:none;min-width:0;letter-spacing:-0.4px}
.note-title-input::placeholder{color:var(--muted2);opacity:.6}
.note-body-input{flex:1;width:100%;background:none;border:none;outline:none;resize:none;padding:16px 20px 40px;font-size:16px;line-height:1.7;caret-color:var(--accent);min-width:0}
.note-body-input::placeholder{color:var(--muted2);opacity:.5}
.notes-main-footer{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);flex-shrink:0;font-weight:500}
.notes-main-footer .meta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* MAP */
.map-tools{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.map-tools::-webkit-scrollbar{display:none}
.map-tool{width:42px;height:42px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--tr);box-shadow:var(--shadow-sm)}
.map-tool:active{transform:scale(.92)}
.map-tool.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px var(--accent-bg)}
.map-tool.danger.active{background:var(--danger);border-color:var(--danger);box-shadow:0 4px 12px rgba(248,113,113,0.3)}
.map-layers{display:flex;gap:6px;padding:4px 16px 8px;flex-shrink:0;align-items:center}
.map-layers .lbl{font-size:12px;color:var(--muted);margin-right:4px;font-weight:600}
.layer-btn{padding:6px 12px;border-radius:8px;background:var(--panel2);border:1px solid transparent;font-size:12px;color:var(--muted);transition:all var(--tr);display:flex;align-items:center;gap:6px;font-weight:600}
.layer-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.map-colors{display:flex;gap:8px;padding:8px 16px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.map-colors::-webkit-scrollbar{display:none}
.map-color{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform var(--tr);box-shadow:var(--shadow-sm)}
.map-color:active{transform:scale(.85)}
.map-color.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent);transform:scale(1.1)}
.map-stamps{display:none;gap:6px;padding:6px 16px 10px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;align-items:center}
.map-stamps::-webkit-scrollbar{display:none}
.map-stamps.show{display:flex}
.stamp-ask{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid transparent;font-size:12px;color:var(--muted);cursor:pointer;flex-shrink:0;font-weight:600}
.stamp-ask input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.stamp-btn{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;line-height:1;box-shadow:var(--shadow-sm);transition:transform var(--tr)}
.stamp-btn:active{transform:scale(.9)}
.stamp-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.map-size-row{display:flex;align-items:center;gap:12px;padding:6px 16px 10px;font-size:12px;color:var(--muted);flex-shrink:0;font-weight:600}
.map-size-row input{flex:1;accent-color:var(--accent);min-width:0}
.map-canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);border-top:1px solid var(--border);contain:strict;touch-action:none;min-height:0}
#mapCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.map-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;color:var(--muted2);font-size:13px;line-height:1.8;padding:20px;flex-direction:column;gap:12px;font-weight:500}
.map-hint svg{width:56px;height:56px;stroke:var(--border2);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.map-hint.hidden{display:none}
.map-sel-bar{position:absolute;bottom:16px;left:50%;transform:translate3d(-50%,100%,0);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity var(--tr),transform var(--tr);font-size:13px;z-index:5;white-space:nowrap;font-weight:500}
.map-sel-bar.show{opacity:1;pointer-events:auto;transform:translate3d(-50%,0,0)}
.map-sel-bar b{color:var(--accent);font-weight:700}
.map-sel-bar .sel-btn{padding:6px 12px;border-radius:8px;background:var(--panel2);font-size:12px;font-weight:600;color:var(--text);transition:background var(--tr)}
.map-sel-bar .sel-btn:active{background:var(--panel3)}
.map-sel-bar .sel-btn.danger{background:var(--danger);color:#fff}
.map-bg-row{display:none;gap:10px;padding:6px 16px 10px;flex-shrink:0;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.map-bg-row.show{display:flex}
.map-bg-row input[type=range]{flex:1;accent-color:var(--accent);min-width:0}

/* PREMIUM BOTTOM NAV */
.nav{display:flex;background:var(--panel);border-top:1px solid var(--border);padding:6px 8px;padding-bottom:calc(6px + var(--safe-b));flex-shrink:0;position:relative;z-index:10;justify-content:space-around}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;color:var(--muted2);font-size:10px;font-weight:600;position:relative;min-width:0;overflow:hidden;border-radius:12px;transition:all var(--tr);border:1px solid transparent;margin:0 2px}
.nav-btn .ico{display:block;transition:transform var(--tr-spring); width: 24px; height: 24px; stroke-width: 2.2;}
.nav-btn.active{color:var(--accent);background:var(--accent-bg);border-color:var(--accent)}
.nav-btn.active .ico{transform:translateY(-1px) scale(1.05); stroke-width: 2.5;}
.nav-btn:active .ico{transform:scale(.9)}

/* DRAWER (Chapters) */
.drawer{position:fixed;top:0;bottom:0;width:min(85vw,320px);background:var(--panel);z-index:80;display:flex;flex-direction:column;transition:transform var(--tr);box-shadow:var(--shadow-md);transform:translateZ(0);contain:strict}
.drawer.left{transform:translate3d(-105%,0,0)}
.drawer.open{transform:translate3d(0,0,0)}
.drawer-hd{display:flex;align-items:center;gap:8px;padding:16px;padding-top:calc(16px + var(--safe-t));border-bottom:1px solid var(--border);flex-shrink:0;min-width:0}
.drawer-hd h2{flex:1;margin:0;font-size:18px;font-weight:700;min-width:0;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px}
.drawer-hd h2 span{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel2);padding:2px 8px;border-radius:10px}
.drawer-body{flex:1;overflow-y:auto;padding:10px 12px 24px}
.ch-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-sm);margin-bottom:4px;cursor:pointer;position:relative;min-width:0;overflow:hidden;background:var(--panel);border:1px solid transparent;transition:background var(--tr)}
.ch-item:active{background:var(--panel2)}
.ch-item.active{background:var(--panel2);border-color:var(--border)}
.ch-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ch-status-dot.draft{background:var(--muted2)}
.ch-status-dot.editing{background:var(--warn)}
.ch-status-dot.ready{background:var(--accent)}
.ch-status-dot.final{background:var(--ok)}
.ch-body{flex:1;min-width:0;overflow:hidden}
.ch-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.2px;margin-bottom:2px}
.ch-meta{font-size:11px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.ch-actions{display:flex;gap:4px;flex-shrink:0}
.ch-mini{width:28px;height:28px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;background:var(--panel3);transition:transform var(--tr),background var(--tr)}
.ch-mini:active{background:var(--border);transform:scale(.9)}

/* OVERLAYS */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:75;opacity:0;pointer-events:none;transition:opacity var(--tr)}
.scrim.show{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--tr)}
.modal.show{opacity:1;pointer-events:auto}
.modal.hidden{display:none}
.modal-box{background:var(--panel);width:100%;max-width:600px;max-height:90dvh;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translate3d(0,100%,0);transition:transform var(--tr);box-shadow:0 -10px 40px rgba(0,0,0,.2);min-width:0}
.modal.show .modal-box{transform:translate3d(0,0,0)}
@media(min-width:600px){.modal{align-items:center}.modal-box{border-radius:24px;max-height:85vh;transform:translate3d(0,24px,0) scale(.96);opacity:0;transition:transform var(--tr-spring),opacity var(--tr)}.modal.show .modal-box{transform:translate3d(0,0,0) scale(1);opacity:1}}
.modal-box h2{margin:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-0.4px}
.modal-box h3{margin:20px 0 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.modal-box .drag{width:36px;height:5px;border-radius:3px;background:var(--border2);margin:-8px auto 16px}

/* Settings Tabs */
.settings-tabs{display:flex;gap:4px;background:var(--panel2);border-radius:14px;padding:4px;margin-bottom:20px;position:sticky;top:-20px;z-index:2;border:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.settings-tabs::-webkit-scrollbar{display:none}
.st-tab{flex:1;padding:10px 8px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);transition:all var(--tr);white-space:nowrap}
.st-tab.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}
.st-pane{display:none;animation:fadeIn var(--tr)}
.st-pane.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* Details/Sections */
details.editor-section{margin:0 0 16px;background:var(--panel2);border-radius:var(--r-sm);border:1px solid var(--border);overflow:hidden}
details.editor-section summary{cursor:pointer;padding:14px 16px;font-size:13px;font-weight:600;color:var(--text);list-style:none;position:relative;user-select:none;display:flex;justify-content:space-between;align-items:center}
details.editor-section summary::-webkit-details-marker{display:none}
details.editor-section summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform var(--tr);margin-right:4px}
details.editor-section[open] summary{border-bottom:1px solid var(--border)}
details.editor-section[open] summary::after{transform:rotate(-135deg)}
details.editor-section .field{padding:0 16px}
details.editor-section .field:first-of-type{padding-top:12px}
details.editor-section .field:last-of-type{padding-bottom:16px;margin-bottom:0}

/* Forms */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--border);padding:14px 16px;border-radius:var(--r-sm);font-size:15px;outline:none;width:100%;min-width:0;transition:border var(--tr),background var(--tr)}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px;-webkit-appearance:none;font-weight:500}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--panel3)}
.field textarea{resize:vertical;min-height:90px;line-height:1.5}
.row{display:flex;gap:10px;margin-top:16px;min-width:0;flex-wrap:wrap}
.btn{flex:1;padding:14px 16px;background:var(--accent);color:#fff;border-radius:var(--r-sm);font-size:15px;font-weight:600;transition:transform var(--tr),opacity var(--tr);min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-sm)}
.btn:active{transform:scale(.97);opacity:.9}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Color Picker */
.color-picker{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
.color-swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform var(--tr)}
.color-swatch:active{transform:scale(.9)}
.color-swatch.on{border-color:var(--panel);box-shadow:0 0 0 2px var(--accent);transform:scale(1.1)}

/* Segmented Control */
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap;border:1px solid var(--border)}
.seg button{flex:1;padding:10px 8px;color:var(--muted);font-size:13px;font-weight:600;border-radius:8px;min-width:70px;transition:all var(--tr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}

/* Switch */
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);gap:16px}
.switch-row:last-child{border-bottom:none}
.switch-row>span:first-child{min-width:0;font-weight:500;font-size:14px}
.switch{width:46px;height:26px;background:var(--panel3);border-radius:14px;position:relative;cursor:pointer;transition:background var(--tr);flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform var(--tr-spring)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translate3d(20px,0,0)}

/* Toasts & Modals */
.toast{position:fixed;bottom:90px;left:50%;transform:translate3d(-50%,20px,0);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:600;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity var(--tr),transform var(--tr-spring);z-index:400;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate3d(-50%,0,0)}
.mode-toast{position:fixed;top:50%;left:50%;transform:translate3d(-50%,-50%,0) scale(.85);background:var(--panel);color:var(--text);border:1px solid var(--border);padding:18px 28px;border-radius:20px;font-size:16px;font-weight:600;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;z-index:450;transition:all var(--tr-spring);text-align:center;max-width:90vw}
.mode-toast.show{opacity:1;transform:translate3d(-50%,-50%,0) scale(1)}

/* Generator */
.gen-tabs{display:flex;gap:6px;padding:4px;background:var(--panel2);border-radius:12px;margin-bottom:16px;border:1px solid var(--border)}
.gen-tab{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);transition:all var(--tr)}
.gen-tab.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}
.gen-result{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:24px 16px;text-align:center;margin-bottom:16px;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;line-height:1.4;letter-spacing:-0.3px}
.gen-recent{margin-top:16px;max-height:160px;overflow-y:auto;padding:10px;background:var(--panel2);border-radius:var(--r-sm);font-size:14px;line-height:1.8;font-weight:500}
.gen-recent-item{padding:6px 8px;border-radius:6px;cursor:pointer;transition:background var(--tr)}
.gen-recent-item:active{background:var(--panel3)}

/* Focus mode */
body.focus-mode .topbar,body.focus-mode .nav{display:none}
body.focus-mode .editor-inner{max-width:640px;padding-top:40px}

/* Reading Overlay */
.reading-overlay{position:fixed;inset:0;background:var(--bg);z-index:150;display:none;flex-direction:column;opacity:0;transition:opacity var(--tr)}
.reading-overlay.show{display:flex;opacity:1}
.reading-top{display:flex;align-items:center;gap:8px;padding:14px 16px;padding-top:calc(14px + var(--safe-t));border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
.reading-top h2{flex:1;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reading-body{flex:1;overflow-y:auto;padding:40px 24px 80px;-webkit-overflow-scrolling:touch}
.reading-content{max-width:640px;margin:0 auto;font-size:19px;line-height:1.8;font-family:'Georgia',serif;white-space:pre-wrap;word-wrap:break-word}
.reading-content p{margin:0 0 1.2em}
.reading-content .wiki-link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0 2px}
.reading-chapter-title{font-size:28px;font-weight:700;margin-bottom:1.5em;text-align:center;line-height:1.3;letter-spacing:-0.5px}
.reading-controls{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-bottom:calc(12px + var(--safe-b));border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap}
.reading-controls .rc-btn{padding:10px 16px;border-radius:10px;background:var(--panel2);font-size:13px;font-weight:600;transition:all var(--tr);display:flex;align-items:center;gap:6px}
.reading-controls .rc-btn:active{transform:scale(.94)}
.reading-controls .rc-btn.playing{background:var(--accent);color:#fff}
.reading-controls input[type=range]{flex:1;min-width:100px;accent-color:var(--accent)}
.reading-controls .meta{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500}

/* Command Palette */
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;display:none;opacity:0;transition:opacity var(--tr);align-items:flex-start;justify-content:center;padding-top:calc(10vh + var(--safe-t));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cmd-overlay.show{display:flex;opacity:1}
.cmd-box{background:var(--panel);width:min(92vw,540px);max-height:70vh;border-radius:var(--r);box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:hidden;transform:translate3d(0,-16px,0) scale(.98);transition:transform var(--tr-spring);border:1px solid var(--border)}
.cmd-overlay.show .cmd-box{transform:translate3d(0,0,0) scale(1)}
.cmd-input{width:100%;background:none;border:none;padding:20px;font-size:18px;outline:none;border-bottom:1px solid var(--border);color:var(--text);font-weight:500}
.cmd-list{flex:1;overflow-y:auto;padding:8px 0}
.cmd-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;font-size:15px;transition:background var(--tr);font-weight:500}
.cmd-item.sel{background:var(--panel2)}
.cmd-item .ci-ico{font-size:20px;flex-shrink:0;width:24px;text-align:center;color:var(--muted)}
.cmd-item .ci-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cmd-item .ci-cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;background:var(--panel2);padding:2px 6px;border-radius:4px}
.cmd-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;font-weight:500}

/* PIN */
.pin-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:20px}
.pin-screen.show{display:flex}
.pin-dots{display:flex;gap:16px;margin-bottom:8px}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--panel3);border:2px solid transparent;transition:all var(--tr)}
.pin-dot.filled{background:var(--accent);transform:scale(1.15)}
.pin-title{font-size:16px;color:var(--muted);margin-bottom:8px;font-weight:500}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:280px;width:100%}
.pin-key{aspect-ratio:1;border-radius:50%;background:var(--panel2);font-size:24px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;transition:transform var(--tr),background var(--tr)}
.pin-key:active{transform:scale(.9);background:var(--accent);color:#fff}
.pin-key.clear{font-size:18px;background:var(--panel3)}
.pin-error{color:var(--danger);font-size:14px;min-height:20px;font-weight:500}

/* Pomodoro */
.pomo-box{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0}
.pomo-ring{position:relative;width:220px;height:220px}
.pomo-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.pomo-ring .bg-circle{fill:none;stroke:var(--panel3);stroke-width:10}
.pomo-ring .fg-circle{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .3s}
.pomo-ring .fg-circle.break{stroke:var(--ok)}
.pomo-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.pomo-phase{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;transition:color var(--tr);font-weight:700}
.pomo-stats{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;font-weight:500}

/* Achievements */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;padding:8px 0}
.ach-item{padding:16px 12px;background:var(--panel2);border-radius:var(--r-sm);text-align:center;border:1px solid var(--border);opacity:.5;transition:all var(--tr)}
.ach-item.unlocked{opacity:1;border-color:var(--warn);box-shadow:0 0 16px rgba(255,159,10,.15);background:var(--panel)}
.ach-item .ach-ico{font-size:32px;margin-bottom:8px;filter:grayscale(1)}
.ach-item.unlocked .ach-ico{filter:none}
.ach-item .ach-name{font-size:12px;font-weight:700;line-height:1.3;margin-bottom:4px}
.ach-item .ach-desc{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.3;font-weight:500}

/* Trash & List items */
.trash-item{padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)}
.trash-item .ti-info{flex:1;min-width:0}
.trash-item .ti-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.2px}
.trash-item .ti-meta{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500}
.sound-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.sound-row .s-ico{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.sound-row .s-name{flex:1;font-size:14px;font-weight:500}
.sound-row input{width:120px;accent-color:var(--accent)}
.st-hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;font-weight:500}

/* Progress Chart */
.progress-chart{width:100%;height:140px;background:var(--panel2);border-radius:var(--r-sm);border:1px solid var(--border);display:block;margin-bottom:16px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style>

const xmlEsc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const pick = a => a[Math.floor(Math.random() * a.length)];
function countWords(t){ if(!t) return 0; let n=0,w=false; for(let i=0;i<t.length;i++){ const c=t.charCodeAt(i); if(c===32||c===9||c===10||c===13||c===160) w=false; else if(!w){w=true;n++;} } return n; }
function initials(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>((w[0]||'').toUpperCase())).join('')||'?'; }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2500); }
function modeToast(msg){ let el=document.querySelector('.mode-toast'); if(!el){el=document.createElement('div');el.className='mode-toast';document.body.appendChild(el);} el.textContent=msg; requestAnimationFrame(()=>el.classList.add('show')); clearTimeout(modeToast._t); modeToast._t=setTimeout(()=>{el.classList.remove('show'); setTimeout(()=>el.remove(),400);},1200); }
async function copyText(txt){ try{await navigator.clipboard.writeText(txt);toast('Скопировано');}catch{toast('Не удалось');} }
function simpleHash(s){ let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return (h>>>0).toString(36); }

function tr(key) {
  return translations[settings.lang]?.[key] || translations['ru'][key] || key;
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (el.children.length > 0) {
      el.childNodes.forEach(node => {
        if (node.nodeType === 3) {
          node.nodeValue = tr(key);
        }
      });
    } else {
      el.textContent = tr(key);
    }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = tr(el.dataset.i18nPlaceholder);
  });
  renderNav();
  renderWorld();
  renderTimeline();
  renderDrafts();
  renderNotesList();
  updateBookHeader();
  updateStats();
}

/* ═══ AMBIENT ═══ */
const ambient = { ctx:null, nodes:{}, gains:{} };
function ensureAudioCtx(){
  try {
    if (!ambient.ctx) ambient.ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (ambient.ctx.state === 'suspended') ambient.ctx.resume().catch(()=>{});
  } catch(e){ console.warn('AudioContext:', e); }
  return ambient.ctx;
}
function startAmbient(type){
  const ctx = ensureAudioCtx(); if (!ctx || ambient.nodes[type]) return;
  const bufferSize = 2 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
  const noise = ctx.createBufferSource(); noise.buffer = buffer; noise.loop = true;
  const filter = ctx.createBiquadFilter();
  const gain = ctx.createGain(); gain.gain.value = 0;
  if (type==='rain'){ filter.type='lowpass'; filter.frequency.value=1200; }
  else if (type==='fire'){ filter.type='lowpass'; filter.frequency.value=400; }
  else if (type==='cafe'){ filter.type='bandpass'; filter.frequency.value=800; filter.Q.value=0.5; }
  else { filter.type='highpass'; filter.frequency.value=600; }
  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start();
  ambient.nodes[type]={source:noise, gain, filter};
  ambient.gains[type]=gain;
}
function setAmbientVolume(type, vol){
  const ctx = ensureAudioCtx(); if (!ctx) return;
  if (vol > 0 && !ambient.nodes[type]) startAmbient(type);
  if (ambient.gains[type]) ambient.gains[type].gain.setTargetAtTime(vol * 0.15, ctx.currentTime, 0.1);
  settings.sounds[type] = vol; saveSettings();
}

/* ═══ TRASH ═══ */
async function softDelete(storeName, item){
  await dbPut('trash', {id:uid(),store:storeName,item:JSON.parse(JSON.stringify(item)),deletedAt:Date.now()});
  await dbDel(storeName, item.id);
}
async function loadTrash(){
  S.trash = await dbAll('trash');
  const cutoff = Date.now() - 30*24*60*60*1000;
  for (const t of S.trash){ if (t.deletedAt < cutoff) await dbDel('trash', t.id); }
  S.trash = S.trash.filter(t=>t.deletedAt >= cutoff);
}
async function restoreFromTrash(trashId){
  const item = S.trash.find(x=>x.id===trashId); if (!item) return;
  await dbPut(item.store, item.item); await dbDel('trash', item.id);
  S.trash = S.trash.filter(x=>x.id!==trashId);
  toast('Восстановлено'); await openBook(S.book); closeModal();
}
function openTrash(){
  if (!S.trash.length){ openModal(`<div class="drag"></div><h2>${tr('trash')}</h2><div class="empty"><svg><use href="#i-trash"/></svg>${tr('noData')}</div><div class="row"><button class="btn ghost" style="width:100%" id="trashClose">${tr('close')}</button></div>`); $('#trashClose').onclick=closeModal; return; }
  const items = S.trash.sort((a,b)=>b.deletedAt-a.deletedAt).map(item=>{
    const stName = {chapters:'Глава',characters:'Персонаж',locations:'Место/Фракция',events:'Событие',drafts:'Заметка'}[item.store]||item.store;
    const name = item.item.title||item.item.name||'Без названия';

  }).join('');

async function moveChapter(idx, dir){ const ni=idx+dir; if(ni<0||ni>=S.chapters.length) return; const [c]=S.chapters.splice(idx,1); S.chapters.splice(ni,0,c); S.chapters.forEach((c,i)=>{c.order=i;}); await Promise.all(S.chapters.map(c=>dbPut('chapters',c))); renderChapters(); }
async function openChapter(ch){
  if (S.chapter && S.chapter.id!==ch.id) await flushSave();
  S.chapter = ch;
  editor.value = ch.text || '';
  chapterTitle.value = ch.title || '';
  S.lastCount[ch.id] = countWords(ch.text||'');
  updateStats(); editor.scrollTop = 0;
}
async function flushSave(){
  if (!S.chapter) return;
  const ch = S.chapter;
  ch.text = editor.value;

  ch.updatedAt = Date.now();

  await dbPut('chapters', ch);

  updateBookHeader();

    closeModal(); toast('Снимок сохранён'); setTimeout(()=>openSnapshots(ch),200);
  };
  $$('[data-restore]').forEach(btn=>btn.onclick=async ()=>{

function handleInput(){
  const ch = S.chapter; if (!ch) return;
  const prev = S.lastCount[ch.id] || 0;
  const now = countWords(editor.value);
  if (now !== prev) addDailyWords(now-prev);
  S.lastCount[ch.id] = now;
  clearTimeout(countTimer); countTimer = setTimeout(updateStats, 200);
  scheduleSave();
  if (settings.typewriter){
    const sel = editor.selectionStart, txt = editor.value;
    const lines = txt.slice(0,sel).split('\n').length;
    const lh = parseFloat(getComputedStyle(editor).lineHeight) || (settings.fontSize*settings.lineHeight);
    const target = (lines-1)*lh - editor.clientHeight*0.4;
    editor.scrollTop = Math.max(0, Math.min(target, editor.scrollHeight - editor.clientHeight));
  }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 700); }
function updateStats(){
  const txt = editor.value;
  const hasSel = editor.selectionStart !== editor.selectionEnd;
  if (hasSel){
    const sel = txt.slice(editor.selectionStart, editor.selectionEnd);
    const w = countWords(sel);
    $('#sWords').textContent = `${fmt(w)} ${tr('wordsShort')}`;
    $('#sChars').textContent = `${fmt(sel.length)} ${tr('charsShort')}`;
    $('#sRead').textContent = `${Math.max(1,Math.round(w/200))} ${tr('minShort')}`;
  } else {
    const w = countWords(txt);
    $('#sWords').textContent = `${fmt(w)} ${tr('wordsShort')}`;
    $('#sChars').textContent = `${fmt(txt.length)} ${tr('charsShort')}`;
    $('#sRead').textContent = `${w?Math.max(1,Math.round(w/200)):0} ${tr('minShort')}`;
  }
}
function addDailyWords(d){
  const t = today();
  if (settings.dailyDate!==t){ settings.dailyDate=t; settings.dailyWords=0; }
  settings.dailyWords = Math.max(0, (settings.dailyWords||0)+d);
  saveSettings(); updateGoal();
  if (!S.progressLog[t]) S.progressLog[t] = 0;
  S.progressLog[t] = Math.max(0, S.progressLog[t] + d);
  localStorage.setItem('pero-progress', JSON.stringify(S.progressLog));
}
function updateGoal(){
  const t = today();
  if (settings.dailyDate!==t){ settings.dailyDate=t; settings.dailyWords=0; saveSettings(); }
  const g = settings.goal||1000, d = settings.dailyWords||0;
  $('#goalText').textContent = `${fmt(d)}/${fmt(g)}`;
  const fill = $('#goalFill');
  fill.style.width = Math.min(100,(d/g)*100)+'%';
  fill.classList.toggle('done', d>=g);
}

function renderWorld(){
  const list = $('#worldList'); if (!list) return;
  const q = ($('#worldSearch').value||'').toLowerCase().trim();
  const filter = S.worldFilter;
  let arr = [];
  if (filter === 'character') arr = S.characters;
  else if (filter === 'place') arr = S.locations.filter(l=>l.kind==='place');
  else arr = S.locations.filter(l=>l.kind==='faction');
  if (q) arr = arr.filter(item => ((item.name||'')+(item.description||'')+(item.role||'')).toLowerCase().includes(q));
  $('#worldTitle').textContent = filter==='character'?tr('characters'):(filter==='place'?tr('places'):tr('factions'));
  $('#worldCount').textContent = arr.length;
  $('#btnGraph').style.display = filter === 'character' ? '' : 'none';
  list.innerHTML = '';
  if (!arr.length){ list.innerHTML = `<div class="empty"><svg><use href="#i-users"/></svg>${tr('noData')}</div>`; return; }
  const frag = document.createDocumentFragment();
  arr.forEach(item=>{
    const el = document.createElement('div');
    el.className = 'char-card';
    if (filter === 'character'){
      const role = ROLES[item.role]||ROLES.supporting;
      el.innerHTML = `<div class="char-avatar" style="background:${item.color||PALETTE[0]}">${esc(initials(item.name))}</div><div class="char-info"><div class="char-name">${esc(item.name||'Без имени')}<span class="char-role" style="background:${role.color}22;color:${role.color}">${role.label}</span></div><div class="char-desc">${esc(item.description||item.appearance||'—')}</div></div>`;
      el.onclick = ()=>openCharEditor(item);
    } else {
      const types = filter==='place'?PLACE_TYPES:FACTION_TYPES;
      const type = types[item.type]||Object.values(types).pop();
      el.innerHTML = `<div class="loc-avatar">${type.icon}</div><div class="char-info"><div class="char-name">${esc(item.name||'Без имени')}<span class="char-role" style="background:rgba(180,124,255,.14);color:#b47cff">${type.label}</span></div><div class="char-desc">${esc(item.description||'—')}</div></div>`;
      el.onclick = ()=>openLocationEditor(item, filter);
    }
    frag.appendChild(el);
  });
  list.appendChild(frag);
}

$('#btnGraph').onclick = ()=>{
  const chars = S.characters;
  if (!chars.length){ toast('Сначала персонажей'); return; }
  const W=340,H=340,cx=W/2,cy=H/2,R=120,pos={};
  chars.forEach((c,i)=>{ const a=(i/chars.length)*Math.PI*2-Math.PI/2; pos[c.id]={x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R}; });
  let edges=''; const seen=new Set();
  chars.forEach(c=>(c.relationships||[]).forEach(r=>{ if (!pos[r.to]) return; const key=[c.id,r.to].sort().join('-')+r.type; if (seen.has(key)) return; seen.add(key); const a=pos[c.id],b=pos[r.to]; edges+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--muted2)" stroke-width="1.5" opacity=".5"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2}" font-size="9" fill="var(--muted)" text-anchor="middle" style="font-family:system-ui">${REL_TYPES[r.type]||r.type}</text>`; }));
  let nodes='';
  chars.forEach(c=>{ const p=pos[c.id]; nodes+=`<circle cx="${p.x}" cy="${p.y}" r="22" fill="${c.color||PALETTE[0]}"/><text x="${p.x}" y="${p.y+4}" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:system-ui">${esc(initials(c.name))}</text><text x="${p.x}" y="${p.y+38}" font-size="10" fill="var(--text)" text-anchor="middle" style="font-family:system-ui">${esc((c.name||'').slice(0,12))}</text>`; });
  openModal(`<div class="drag"></div><h2>${tr('graph')}</h2><svg class="graph-svg" viewBox="0 0 ${W} ${H}">${edges}${nodes}</svg><div class="row"><button class="btn ghost" style="width:100%" id="gClose">${tr('close')}</button></div>`);
  $('#gClose').onclick = closeModal;
};

function renderTimeline(){
  const list = $('#timelineList'); if (!list) return;
  list.innerHTML = '';
  if (!S.events.length){ list.innerHTML = `<div class="empty"><svg><use href="#i-clock"/></svg>${tr('noData')}</div>`; return; }
  const sorted = [...S.events].sort((a,b)=>(a.date||'').localeCompare(b.date||'','ru'));
  const wrap = document.createElement('div'); wrap.className = 'timeline-list';
  sorted.forEach(ev=>{
    const imp = IMPORTANCE[ev.importance]||IMPORTANCE.med;
    const el = document.createElement('div');
    el.className = `event-card ${imp.cls}`;
    const chName = ev.chapterId ? (S.chapters.find(c=>c.id===ev.chapterId)?.title||'') : '';
    el.innerHTML = `<div class="event-date">${esc(ev.date||'—')}${chName?`<span class="link-tag">📖 ${esc(chName)}</span>`:''}</div><div class="event-title">${esc(ev.title||'Без названия')}</div>${ev.description?`<div class="event-desc">${esc(ev.description)}</div>`:''}`;
    el.onclick = ()=>openEventEditor(ev);
    wrap.appendChild(el);
  });
  list.appendChild(wrap);
}

function renderDrafts(){
  const list = $('#draftList'); if (!list) return;
  const q = ($('#draftSearch').value||'').toLowerCase().trim();
  let arr = S.drafts;
  if (S.draftFilter!=='all') arr = arr.filter(d=>d.category===S.draftFilter);
  if (q) arr = arr.filter(d=>(d.title||'').toLowerCase().includes(q)||(d.text||'').toLowerCase().includes(q));
  arr = [...arr].sort((a,b)=>a.pinned!==b.pinned?(a.pinned?-1:1):(b.updatedAt||0)-(a.updatedAt||0));
  list.innerHTML = '';
  if (!arr.length){ list.innerHTML = `<div class="empty"><svg><use href="#i-bulb"/></svg>${tr('noData')}</div>`; return; }
  const frag = document.createDocumentFragment();

      if (map.tool==='eraser' && map.eraserStart && Math.hypot(x-map.eraserStart.x, y-map.eraserStart.y)>8) map.eraserMoved = true;
      scheduleMapRender();
    }
  }
}
function handleMapPointerUp(e){
  if (!map.canvas) return;
  e.preventDefault();
  map.pointers.delete(e.pointerId);
  if (map.pointers.size<2) map.gesture=null;
  if (map.pointers.size===1){ map.drawing=false; map.currentStroke=null; map.panStart=null; }
  if (map.pointers.size===0){
    if (map.pendingMarker){ showMarkerDialog(map.pendingMarker.wx, map.pendingMarker.wy, null); map.pendingMarker=null; }
    else if (map.pendingText){ showTextDialog(map.pendingText.wx, map.pendingText.wy, null); map.pendingText=null; }
    else if (map.pendingStamp){ const wx=map.pendingStamp.wx, wy=map.pendingStamp.wy; if (map.stampAskName){ showStampDialog({tool:'stamp',x:wx,y:wy,emoji:map.stampEmoji,size:Math.max(28,map.size*4),name:''}, true); } else { map.strokes.push({tool:'stamp',x:wx,y:wy,emoji:map.stampEmoji,size:Math.max(28,map.size*4),name:''}); map.redo=[]; saveMapDebounced(); updateMapHint(); scheduleMapRender(); } map.pendingStamp=null; }
    else if (map.drawing && map.currentStroke){
      if (map.tool==='eraser'){ if (!map.eraserMoved && map.eraserStart){ const hit=hitTestAny(map.eraserStart.wx, map.eraserStart.wy); if (hit){ map.strokes=map.strokes.filter(s=>s!==hit.stroke); map.redo=[]; toast('Удалено'); saveMapDebounced(); scheduleMapRender(); updateMapHint(); } else { map.strokes.push(map.currentStroke); saveMapDebounced(); } } else { map.strokes.push(map.currentStroke); saveMapDebounced(); } }
      else { const pts=map.currentStroke.points; const start=pts[0], end=pts[pts.length-1]; const moved = Math.hypot(end.x-start.x, end.y-start.y); if (moved<6/map.view.scale && pts.length<=2){ const hit=hitTestAny(start.x,start.y); if (hit){ if (hit.stroke.tool==='marker') showMarkerDialog(hit.stroke.x,hit.stroke.y,hit.stroke); else if (hit.stroke.tool==='text') showTextDialog(hit.stroke.x,hit.stroke.y,hit.stroke); else if (hit.stroke.tool==='stamp') showStampDialog(hit.stroke,false); map.drawing=false; map.currentStroke=null; scheduleMapRender(); return; } } map.strokes.push(map.currentStroke); map.redo=[]; saveMapDebounced(); updateMapHint(); scheduleMapRender(); }
      map.drawing=false; map.currentStroke=null;
    }
    if (map.tool==='pan') map.panStart = null;
    map.eraserStart = null; map.eraserMoved = false;
  }
}
function handleMapWheel(e){ if (!map.canvas) return; e.preventDefault(); const rect = map.canvas.getBoundingClientRect(); const x = e.clientX-rect.left, y = e.clientY-rect.top; const factor = e.deltaY<0?1.15:0.87; const ns = Math.max(0.2,Math.min(6,map.view.scale*factor)); const actual = ns/map.view.scale; map.view.x = x-(x-map.view.x)*actual; map.view.y = y-(y-map.view.y)*actual; map.view.scale = ns; scheduleMapRender(); }
function hitTestAny(wx, wy){
  const tol = 18/map.view.scale;
  for (let i=map.strokes.length-1;i>=0;i--){
    const s = map.strokes[i];
    if (!map.layers[strokeLayer(s)]) continue;
    if (s.tool==='stamp'){ const r=(s.size/2+8)/map.view.scale; if (Math.hypot(s.x-wx,s.y-wy)<r) return {index:i,stroke:s}; }
    else if (s.tool==='marker'||s.tool==='text'){ const r=16/map.view.scale; if (Math.hypot(s.x-wx,s.y-wy)<r) return {index:i,stroke:s}; }
    else if (s.points){ for (const p of s.points) if (Math.hypot(p.x-wx,p.y-wy)<tol) return {index:i,stroke:s}; }
  }
  return null;
}
function mapUndo(){ if (!map.strokes.length) return; map.redo.push(map.strokes.pop()); updateMapHint(); saveMapDebounced(); scheduleMapRender(); }
function mapRedo(){ if (!map.redo.length) return; map.strokes.push(map.redo.pop()); updateMapHint(); saveMapDebounced(); scheduleMapRender(); }

function exportMapPng(){
  if (!map.canvas){ toast('Открой карту'); return; }
  const scale=2; const off=document.createElement('canvas'); off.width=map.cssW*scale; off.height=map.cssH*scale;
  const octx = off.getContext('2d'); octx.scale(scale,scale);
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0f0f12';
  octx.fillStyle=bg; octx.fillRect(0,0,map.cssW,map.cssH);
  octx.save(); octx.translate(map.view.x,map.view.y); octx.scale(map.view.scale,map.view.scale);
  if (map.background && map.bgImg && map.bgImg.complete){ const iw=map.bgImg.width, ih=map.bgImg.height, s=Math.min(900/iw,900/ih); octx.globalAlpha=map.background.opacity; octx.drawImage(map.bgImg,-iw*s/2,-ih*s/2,iw*s,ih*s); octx.globalAlpha=1; }

  octx.restore();
  off.toBlob(blob=>{ if (!blob){ toast('Ошибка'); return; } downloadBlob(blob, safeName()+'_map.png'); toast('Скачано PNG'); }, 'image/png');
}

/* ═══ READING ═══ */
let readingChapterIdx = 0, ttsUtterance = null, ttsPlaying = false;
function openReading(){
  if (!S.chapters.length) return;
  readingChapterIdx = S.chapters.findIndex(c=>c.id===S.chapter?.id);
  if (readingChapterIdx<0) readingChapterIdx = 0;
  renderReadingChapter();
  $('#readingOverlay').classList.add('show');
}
function renderReadingChapter(){
  const ch = S.chapters[readingChapterIdx];
  if (!ch) return;
  $('#readingTitle').textContent = ch.title || 'Без названия';
  const text = ch.text || '';
  let html = esc(text).replace(/\[\[([^\]]+)\]\]/g, (m, name) => {
    const trimmed = name.trim();
    const char = S.characters.find(c=>c.name===trimmed);
    const loc = S.locations.find(l=>l.name===trimmed);
    if (char) return `<span class="wiki-link" data-wiki-type="character" data-wiki-id="${char.id}">${esc(trimmed)}</span>`;
    if (loc) return `<span class="wiki-link" data-wiki-type="location" data-wiki-id="${loc.id}">${esc(trimmed)}</span>`;
    return `<span class="wiki-link" style="color:var(--muted)">${esc(trimmed)}</span>`;
  });
  html = html.split('\n\n').map(p=>p.trim() ? `<p>${p.replace(/\n/g,'<br>')}</p>` : '').join('');
  $('#readingContent').innerHTML = `<div class="reading-chapter-title">${esc(ch.title)}</div>${html || `<p style="color:var(--muted);font-style:italic">${tr('noData')}</p>`}`;
  const w = countWords(text);
  $('#readingMeta').textContent = `${fmt(w)} ${tr('wordsShort')} · ${Math.max(1,Math.round(w/200))} ${tr('minShort')} · ${readingChapterIdx+1}/${S.chapters.length}`;
  $('#readingBody').scrollTop = 0;
  $$('.wiki-link[data-wiki-type]').forEach(el=>el.onclick=()=>{
    if (el.dataset.wikiType==='character'){ const c = S.characters.find(x=>x.id===el.dataset.wikiId); if (c) openCharEditor(c); }
    else { const l = S.locations.find(x=>x.id===el.dataset.wikiId); if (l) openLocationEditor(l, l.kind); }
  });
  stopTTS();
}
$('#btnRead').onclick = openReading;
$('#readingClose').onclick = ()=>{ stopTTS(); $('#readingOverlay').classList.remove('show'); };
$('#readingPrev').onclick = ()=>{ if (readingChapterIdx>0){ readingChapterIdx--; renderReadingChapter(); } };
$('#readingNext').onclick = ()=>{ if (readingChapterIdx<S.chapters.length-1){ readingChapterIdx++; renderReadingChapter(); } };
function stopTTS(){ if (ttsUtterance){ speechSynthesis.cancel(); ttsUtterance=null; } ttsPlaying=false; $('#readingTTS').innerHTML='<svg class="svg-ico sm"><use href="#i-volume"/></svg> '+tr('read'); $('#readingTTS').classList.remove('playing'); }
$('#readingTTS').onclick = ()=>{
  if (ttsPlaying){ stopTTS(); return; }
  const ch = S.chapters[readingChapterIdx]; if (!ch) return;
  if (!('speechSynthesis' in window)){ toast('TTS не поддерживается'); return; }
  const text = (ch.text||'').replace(/\[\[|\]\]/g,'');
  if (!text.trim()){ toast('Пустая глава'); return; }
  ttsUtterance = new SpeechSynthesisUtterance(text);
  ttsUtterance.lang = settings.lang === 'ru' ? 'ru-RU' : (settings.lang === 'fr' ? 'fr-FR' : (settings.lang === 'es' ? 'es-ES' : (settings.lang === 'de' ? 'de-DE' : (settings.lang === 'zh' ? 'zh-CN' : 'en-US'))));
  ttsUtterance.rate = parseFloat($('#readingRate').value) || 1;
  ttsUtterance.onend = ()=>{ stopTTS(); };
  ttsUtterance.onerror = ()=>{ stopTTS(); };
  speechSynthesis.speak(ttsUtterance);
  ttsPlaying = true;
  $('#readingTTS').innerHTML = '<svg class="svg-ico sm"><use href="#i-pause"/></svg> Стоп';
  $('#readingTTS').classList.add('playing');
  localStorage.setItem('pero-tts-used','1');
};

/* ═══ POMODORO ═══ */
let pomo = {active:false, phase:'work', end:0, interval:null, total:0};
function openPomodoro(){
  const r = 90, c = 2*Math.PI*r;
  const left = pomo.active ? Math.max(0, pomo.end - Date.now()) : 25*60*1000;
  const total = pomo.active ? pomo.total : 25*60*1000;
  const mm = String(Math.floor(left/60000)).padStart(2,'0');
  const ss = String(Math.floor((left%60000)/1000)).padStart(2,'0');
  const cycles = +(localStorage.getItem('pero-pomo-cycles')||0);
  const progress = pomo.active ? (1 - left/total) : 0;
  const dashoffset = c * (1 - progress);
  openModal(`
    <div class="drag"></div>
    <h2>${tr('pomodoro')}</h2>
    <div class="pomo-box">
      <div class="pomo-ring">
        <svg viewBox="0 0 200 200">
          <circle class="bg-circle" cx="100" cy="100" r="${r}"/>
          <circle class="fg-circle${pomo.active&&pomo.phase==='break'?' break':''}" cx="100" cy="100" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${dashoffset}"/>
        </svg>
        <div class="pomo-time" id="pomoTime">${mm}:${ss}</div>
      </div>
      <div class="pomo-phase" id="pomoPhase" style="color:${pomo.active?(pomo.phase==='work'?'var(--accent)':'var(--ok)'):'var(--muted)'}">${pomo.active?(pomo.phase==='work'?'Работа':'Перерыв'):'Готов'}</div>
      <div class="pomo-stats">Циклов сегодня: <b>${cycles}</b></div>
      <div class="row" style="width:100%;max-width:280px">
        <button class="btn ghost" id="pomoWork">25 мин</button>
        <button class="btn ghost" id="pomoBreak">5 мин</button>
      </div>
      <div class="row" style="width:100%;max-width:280px">
        <button class="btn ghost" id="pomoClose">${tr('close')}</button>
        <button class="btn" id="pomoStart">${pomo.active?'Стоп':'Старт'}</button>
      </div>
    </div>`);
  let localPhase = 'work', localMin = 25;
  $('#pomoWork').onclick = ()=>{ localPhase='work'; localMin=25; $('#pomoTime').textContent='25:00'; $('#pomoPhase').textContent='Работа'; };
  $('#pomoBreak').onclick = ()=>{ localPhase='break'; localMin=5; $('#pomoTime').textContent='05:00'; $('#pomoPhase').textContent='Перерыв'; };
  $('#pomoClose').onclick = closeModal;
  $('#pomoStart').onclick = ()=>{
    if (pomo.active){ stopPomodoro(); closeModal(); }
    else startPomodoro(localPhase, localMin);
  };
}
function startPomodoro(phase, min){
  if (pomo.interval) clearInterval(pomo.interval);
  pomo.active = true; pomo.phase = phase;
  pomo.end = Date.now() + min*60*1000;
  pomo.total = min*60*1000;
  const startBtn = $('#pomoStart');
  if (startBtn) startBtn.textContent = 'Стоп';
  const phaseEl = $('#pomoPhase');
  if (phaseEl){ phaseEl.textContent = phase==='work'?'Работа':'Перерыв'; phaseEl.style.color = phase==='work'?'var(--accent)':'var(--ok)'; }
  const update = ()=>{
    const left = Math.max(0, pomo.end - Date.now());
    const mm = String(Math.floor(left/60000)).padStart(2,'0'), ss = String(Math.floor((left%60000)/1000)).padStart(2,'0');
    const timeEl = $('#pomoTime'); if (timeEl) timeEl.textContent = `${mm}:${ss}`;
    const fg = document.querySelector('.pomo-ring .fg-circle');
    if (fg){ const r = 90, c = 2*Math.PI*r; const prog = 1 - left/pomo.total; fg.setAttribute('stroke-dashoffset', c*(1-prog)); }
    if (left<=0){
      clearInterval(pomo.interval); pomo.active = false;
      localStorage.setItem('pero-pomo-done','1');
      if (pomo.phase==='work'){ const cyc = (+(localStorage.getItem('pero-pomo-cycles')||0)) + 1; localStorage.setItem('pero-pomo-cycles', cyc); }
      toast(pomo.phase==='work'?'✅ Работа завершена!':'☕ Перерыв окончен');
      modeToast(pomo.phase==='work'?'🍅 Работа!':'☕ Отдых!');
      if (startBtn) startBtn.textContent = 'Старт';
    }
  };
  update();
  pomo.interval = setInterval(update, 500);
}
function stopPomodoro(){
  if (pomo.interval) clearInterval(pomo.interval);
  pomo.active = false;
}

/* ═══ PROGRESS ═══ */
function renderProgressChart(){
  const days = [];
  for (let i=29;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const values = days.map(d=>S.progressLog[d]||0);
  const max = Math.max(1, ...values);
  const canvas = document.createElement('canvas');
  canvas.className = 'progress-chart';
  canvas.width = 600; canvas.height = 240;
  const ctx = canvas.getContext('2d');
  const W = 600, H = 240, pad = 20;
  ctx.clearRect(0,0,W,H);
  const barW = (W-pad*2)/30;
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#888';
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6b8afd';
  days.forEach((d,i)=>{
    const v = values[i];
    const bh = (v/max)*(H-pad*2);
    const x = pad + i*barW + barW*0.15;
    const y = H-pad-bh;
    ctx.fillStyle = i===29 ? accent : 'rgba(107,138,253,0.4)';
    if (v>0) ctx.fillRect(x, y, barW*0.7, bh);
    else { ctx.fillStyle='rgba(128,128,128,0.2)'; ctx.fillRect(x, H-pad-2, barW*0.7, 2); }
  });
  ctx.fillStyle = textColor; ctx.font = '600 12px "Inter",system-ui'; ctx.textAlign='center';
  ctx.fillText(days[0].slice(5), pad+barW/2, H-4);
  ctx.fillText(days[14].slice(5), pad+barW*14.5, H-4);
  ctx.fillText(days[29].slice(5), W-pad-barW/2, H-4);
  return canvas;
}
function openProgress(){
  const canvas = renderProgressChart();
  openModal(`<div class="drag"></div><h2>${tr('progress')}</h2><div id="progressChartWrap"></div><div style="margin-top:16px;font-size:14px;color:var(--muted);line-height:1.8;font-weight:500">Всего слов: <b style="color:var(--text)">${fmt(totalWords())}</b><br>Сегодня: <b style="color:var(--text)">${fmt(settings.dailyWords||0)}</b><br>Дней с записями: <b style="color:var(--text)">${Object.values(S.progressLog).filter(v=>v>0).length}</b></div><div class="row"><button class="btn ghost" style="width:100%" id="progClose">${tr('close')}</button></div>`);
  $('#progressChartWrap').appendChild(canvas);
  $('#progClose').onclick = closeModal;
}

  const counts = {};

/* ═══ SENTENCE ANALYSIS ═══ */
function openSentenceAnalysis(){
  const allText = S.chapters.map(c=>({title:c.title, text:c.text||''})).filter(c=>c.text);
  const stats = [];
  let totalSent = 0, totalWordsCount = 0;
  allText.forEach(c=>{
    const sents = c.text.split(/[.!?…]+/).map(s=>s.trim()).filter(s=>s.length>0);
    sents.forEach(s=>{ const w = countWords(s); if (w>0){ totalSent++; totalWordsCount+=w; stats.push({chapter:c.title, words:w, sample:s.slice(0,120)}); } });
  });
  const avg = totalSent ? Math.round(totalWordsCount/totalSent) : 0;
  const longest = [...stats].sort((a,b)=>b.words-a.words).slice(0,10);
  openModal(`<div class="drag"></div><h2>${tr('sentences')}</h2><div style="font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:16px;font-weight:500">Предложений: <b style="color:var(--text)">${totalSent}</b><br>Средняя длина: <b style="color:var(--text)">${avg} слов</b><br><span style="font-size:11px">Идеал для чтения: 12–20 слов. Длинные (>40) стоит разбивать.</span></div><h3>Самые длинные</h3><div style="max-height:50vh;overflow-y:auto">${longest.map((s,i)=>`<div class="trash-item"><div class="ti-info"><div class="ti-name" style="color:${s.words>40?'var(--danger)':s.words>25?'var(--warn)':'var(--ok)'}">${s.words} ${tr('wordsShort')} · ${esc(s.chapter)}</div><div class="ti-meta" style="white-space:normal">${esc(s.sample)}…</div></div></div>`).join('')}</div><div class="row"><button class="btn ghost" style="width:100%" id="sentClose">${tr('close')}</button></div>`);

}

document.addEventListener('keydown', e=>{
  if (e.target.matches('input,textarea,select')){ if (e.key==='Escape'){ e.target.blur(); } return; }
  if ((e.ctrlKey||e.metaKey) && e.key==='k'){ e.preventDefault(); openCmd(); }
  else if ((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); flushSave().then(()=>toast('Сохранено')); }
  else if ((e.ctrlKey||e.metaKey) && e.key==='n'){ e.preventDefault(); $('#btnNewChapter').click(); }
  else if ((e.ctrlKey||e.metaKey) && e.key==='r'){ e.preventDefault(); openReading(); }
  else if ((e.ctrlKey||e.metaKey) && e.key==='f'){ e.preventDefault(); openCmd(); }
  else if (e.key==='Escape'){ closeModal(); closeCmd(); closeDrawer(); closeNotesDrawer(); }
});

/* ═══ BACKUP / RESTORE ═══ */
async function exportBackup(){
  await flushSave(); await flushNoteSave(); await saveMap();
  const data = {version:10, exportedAt:new Date().toISOString(), books:await dbAll('books'), chapters:await dbAll('chapters'), characters:await dbAll('characters'), locations:await dbAll('locations'), events:await dbAll('events'), drafts:await dbAll('drafts'), snapshots:await dbAll('snapshots'), maps:await dbAll('maps'), settings, progressLog:S.progressLog, achievements:[...S.unlocked]};
  downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}), `pero_backup_${today()}.json`);
  localStorage.setItem('pero-last-backup', Date.now());
  toast('Резервная копия сохранена');
}
function importBackup(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = async e=>{
    const f = e.target.files[0]; if (!f) return;
    if (!confirm('Восстановить из бэкапа?')) return;
    try {
      const data = JSON.parse(await f.text());
      for (const s of ['books','chapters','characters','locations','events','drafts','snapshots','maps','trash']) await dbClear(s);
      for (const s of ['books','chapters','characters','locations','events','drafts','snapshots','maps']){
        if (Array.isArray(data[s])) for (const item of data[s]) await dbPut(s, item);
      }
      if (data.settings) Object.assign(settings, data.settings), saveSettings();
      if (data.progressLog) S.progressLog = data.progressLog, localStorage.setItem('pero-progress', JSON.stringify(data.progressLog));
      if (data.achievements) S.unlocked = new Set(data.achievements), localStorage.setItem('pero-ach', JSON.stringify([...S.unlocked]));
      toast('Восстановлено, перезагружаю…'); setTimeout(()=>location.reload(), 800);
    } catch (err){ toast('Ошибка: '+err.message); }
  };
  inp.click();
}
function checkAutoBackup(){
  const last = +localStorage.getItem('pero-last-backup')||0;
  const week = 7*24*60*60*1000;
  if (Date.now() - last > week){ setTimeout(()=>{ modeToast('💾 Давно не было бэкапа'); toast('Совет: Настройки → Резервная копия'); }, 3000); }
}
async function gistSync(){
  if (!settings.gistToken){ toast('Укажи токен GitHub'); return; }
  await flushSave(); await flushNoteSave();
  const data = {version:10, books:await dbAll('books'), chapters:await dbAll('chapters'), characters:await dbAll('characters'), locations:await dbAll('locations'), events:await dbAll('events'), drafts:await dbAll('drafts'), snapshots:await dbAll('snapshots'), maps:await dbAll('maps'), settings, progressLog:S.progressLog};
  const filename = 'pero_backup.json';
  const body = {description:'Перо backup', public:false, files:{[filename]:{content:JSON.stringify(data)}}};
  try {
    let url = 'https://api.github.com/gists';
    if (settings.gistId) url += '/' + settings.gistId;
    const r = await fetch(url, {method: settings.gistId?'PATCH':'POST', headers:{'Authorization':'token '+settings.gistToken,'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    settings.gistId = j.id; saveSettings();
    toast('Синхронизировано с Gist');
    localStorage.setItem('pero-last-backup', Date.now());
  } catch(e){ toast('Ошибка: '+e.message); }
}
async function gistRestore(){
  if (!settings.gistId){ toast('Нет gistId'); return; }
  if (!confirm('Восстановить из Gist?')) return;
  try {
    const r = await fetch('https://api.github.com/gists/'+settings.gistId, {headers: settings.gistToken?{'Authorization':'token '+settings.gistToken}:{}});

function crc32(data){ const t = crc32.table || (crc32.table=(()=>{const a=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;a[i]=c;}return a;})()); let crc=0xFFFFFFFF; for (let i=0;i<data.length;i++) crc=t[(crc^data[i])&0xFF]^(crc>>>8); return (crc^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc = new TextEncoder();
  const locals = []; let offset = 0;
  for (const f of files){ const nameB = enc.encode(f.name); const data = typeof f.data==='string'?enc.encode(f.data):f.data; const crc = crc32(data); const lh = new Uint8Array(30+nameB.length); const dv = new DataView(lh.buffer); dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true); dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true); dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true); dv.setUint16(26,nameB.length,true); dv.setUint16(28,0,true); lh.set(nameB, 30); locals.push({nameB,data,crc,lh,offset}); offset += lh.length+data.length; }
  let cdSize = 0; const centrals = [];
  for (const l of locals){ const ch = new Uint8Array(46+l.nameB.length); const dv = new DataView(ch.buffer); dv.setUint32(0,0x02014b50,true); dv.setUint16(4,20,true); dv.setUint16(6,20,true); dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true); dv.setUint16(14,0,true); dv.setUint32(16,l.crc,true); dv.setUint32(20,l.data.length,true); dv.setUint32(24,l.data.length,true); dv.setUint16(28,l.nameB.length,true); dv.setUint16(30,0,true); dv.setUint16(32,0,true); dv.setUint16(34,0,true); dv.setUint16(36,0,true); dv.setUint32(38,0,true); dv.setUint32(42,l.offset,true); ch.set(l.nameB, 46); centrals.push(ch); cdSize += ch.length; }
  const eocd = new Uint8Array(22); const edv = new DataView(eocd.buffer); edv.setUint32(0,0x06054b50,true); edv.setUint16(8,files.length,true); edv.setUint16(10,files.length,true); edv.setUint32(12,cdSize,true); edv.setUint32(16,offset,true);
  const total = offset+cdSize+22; const out = new Uint8Array(total); let pos = 0;
  for (const l of locals){ out.set(l.lh,pos); pos += l.lh.length; out.set(l.data,pos); pos += l.data.length; }
  for (const c of centrals){ out.set(c,pos); pos += c.length; }
  out.set(eocd, pos);
  return out;
}
async function downloadBlob(blob, filename){
  if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: blob.type })] })) {
    try {
      await navigator.share({ files: [new File([blob], filename, { type: blob.type })], title: filename });
      toast('Файл сохранён');
      return;
    } catch(e) { console.log('Share failed, fallback', e); }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function importFiles(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.txt,.md,.markdown'; inp.multiple = true;
  inp.onchange = async e=>{
    const files = [...e.target.files]; if (!files.length) return;
    let total = 0;
    for (const f of files){
      const text = await f.text();
      const isMd = /\.(md|markdown)$/i.test(f.name);
      let chapters = [];
      if (isMd){ const parts = text.split(/^##\s+/m); if (parts.length>1){ parts.slice(1).forEach(part=>{ const nl = part.indexOf('\n'); const title = nl>=0?part.slice(0,nl).trim():part.trim(); const body = nl>=0?part.slice(nl+1).trim():''; chapters.push({title:title||'Без названия', text:body}); }); } else chapters.push({title:f.name.replace(/\.[^.]+$/,''), text}); }
      else chapters.push({title:f.name.replace(/\.[^.]+$/,''), text});
      const maxOrder = S.chapters.reduce((m,c)=>Math.max(m,c.order),-1);
      for (let i=0;i<chapters.length;i++){ const ch = {id:uid(),bookId:S.book.id,title:chapters[i].title,text:chapters[i].text,order:maxOrder+1+i,wordCount:countWords(chapters[i].text),status:'draft',color:'',pinned:false,pov:'',createdAt:Date.now(),updatedAt:Date.now()}; await dbPut('chapters', ch); S.chapters.push(ch); total++; }
    }
    renderChapters(); updateBookHeader(); toast(`Импортировано глав: ${total}`);
  };
  inp.click();
}

    $$('#segMode button').forEach(b=>b.classList.toggle('on', b.dataset.mode===settings.mode));

    $$('#segLang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===settings.lang));
  };
  refreshSeg();
  $$('#segMode button').forEach(b=>b.onclick=()=>{ closeModal(); setTimeout(()=>setMode(b.dataset.mode), 200); });
  $$('#segLang button').forEach(b=>b.onclick=()=>{ 
    settings.lang=b.dataset.lang; 
    saveSettings(); 
    applyTranslations(); 
    closeModal(); 
    setTimeout(()=>$('#btnMore').click(), 350); // Переоткрываем настройки на новом языке
  });
  $$('#segTheme button').forEach(b=>b.onclick=()=>{ settings.theme=b.dataset.th; saveSettings(); applySettings(); refreshSeg(); });
  $$('#segFont button').forEach(b=>b.onclick=()=>{ settings.font=b.dataset.f; saveSettings(); applySettings(); refreshSeg(); });
  $('#rngFs').oninput = e => { settings.fontSize=+e.target.value; $('#fsVal').textContent=settings.fontSize; saveSettings(); applySettings(); };
  $('#rngLh').oninput = e => { settings.lineHeight=+e.target.value; $('#lhVal').textContent=settings.lineHeight.toFixed(1); saveSettings(); applySettings(); };
  $('#swFocus').onclick = e => { settings.focus=!settings.focus; saveSettings(); applySettings(); e.currentTarget.classList.toggle('on', settings.focus); };
  $('#swFH').onclick = e => { settings.focusHighlight=!settings.focusHighlight; saveSettings(); applySettings(); e.currentTarget.classList.toggle('on', settings.focusHighlight); };
  $('#swTW').onclick = e => { settings.typewriter=!settings.typewriter; saveSettings(); e.currentTarget.classList.toggle('on', settings.typewriter); };
  $('#inpGoal').onchange = e => { settings.goal=Math.max(100,+e.target.value||1000); saveSettings(); updateGoal(); };
  $$('[data-snd]').forEach(inp=>{ inp.oninput = e => setAmbientVolume(inp.dataset.snd, parseFloat(e.target.value)); });
  $('#swBkp').onclick = e => { settings.autoBackup=!settings.autoBackup; saveSettings(); e.currentTarget.classList.toggle('on', settings.autoBackup); };
  $('#ttPomo').onclick = ()=>{ closeModal(); setTimeout(openPomodoro, 350); };
  $('#ttSprint').onclick = ()=>{ closeModal(); setTimeout(openSprintModal, 350); };
  $('#ttAch').onclick = ()=>{ closeModal(); setTimeout(openAchievements, 350); };
  $('#ttProgress').onclick = ()=>{ closeModal(); setTimeout(openProgress, 350); };
  $('#ttRep').onclick = ()=>{ closeModal(); setTimeout(openRepetitionCheck, 350); };
  $('#ttSent').onclick = ()=>{ closeModal(); setTimeout(openSentenceAnalysis, 350); };
  $('#ttTrash').onclick = ()=>{ closeModal(); setTimeout(openTrash, 350); };
  $('#ttPin').onclick = ()=>{ closeModal(); setTimeout(openPinSetup, 350); };
  if ($('#expTxt')) $('#expTxt').onclick = exportTxt;
  if ($('#expMd')) $('#expMd').onclick = exportMd;
  if ($('#expFb2')) $('#expFb2').onclick = exportFb2;
  if ($('#expDocx')) $('#expDocx').onclick = exportDocx;
  if ($('#expEpub')) $('#expEpub').onclick = exportEpub;
  if ($('#expBeta')) $('#expBeta').onclick = exportBetaReader;
  if ($('#doPrint')) $('#doPrint').onclick = printBook;
  if ($('#impFiles')) $('#impFiles').onclick = importFiles;
  if ($('#expNotes')) $('#expNotes').onclick = exportNotesTxt;
  $('#expBackup').onclick = exportBackup;
  $('#impBackup').onclick = importBackup;
  $('#gistTok').onchange = e => { settings.gistToken = e.target.value.trim(); saveSettings(); };
  $('#gistId').onchange = e => { settings.gistId = e.target.value.trim(); saveSettings(); };
  $('#gistSync').onclick = gistSync;
  $('#gistRestore').onclick = gistRestore;
  $('#mClose').onclick = closeModal;
};

function applySettings(){
  document.documentElement.dataset.theme = settings.theme;
  const fontCss = FONTS[settings.font]?.css || FONTS.serif.css;
  editor.style.fontFamily = fontCss;
  editor.style.fontSize = settings.fontSize + 'px';
  editor.style.lineHeight = settings.lineHeight;
  chapterTitle.style.fontFamily = fontCss;
  document.body.classList.toggle('focus-mode', !!settings.focus);
  document.body.classList.toggle('focus-highlight', !!settings.focusHighlight);
  const nb = $('#noteBody');
  if (nb){ nb.style.fontFamily = fontCss; nb.style.fontSize = settings.fontSize + 'px'; nb.style.lineHeight = settings.lineHeight; }
}

boot().catch(err => { console.error(err); alert('Ошибка: ' + err.message); });
</script>
</body>
</html>
